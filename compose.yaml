services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: '${SOC_SQL_PASSWORD:-SocDemo!2026Local}'
    ports:
      - '127.0.0.1:${SOC_SQL_PORT:-14333}:1433'
    volumes:
      - socsql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -l 5 -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
  app:
    build: .
    ports:
      - '127.0.0.1:${SOC_APP_PORT:-8081}:8080'
    environment:
      ConnectionStrings__Soc: 'Server=sqlserver,1433;Database=Soc3Demo;User Id=sa;Password=${SOC_SQL_PASSWORD:-SocDemo!2026Local};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5'
      Demo__Enabled: 'true'
      ASPNETCORE_ENVIRONMENT: Development
      # Permit the internal Compose DNS name used by smoke and simulator.
      AllowedHosts: 'localhost;127.0.0.1;app'
      DataProtection__KeyPath: /app/keys
    volumes:
      - sockeys:/app/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s
  simulator:
    profiles: ["simulator"]
    image: node:24-bookworm-slim
    working_dir: /demo
    command: ["node", "simulate-alerts.mjs"]
    environment:
      SOC_URL: http://app:8080
      SOC_SIM_KEY: '${SOC_SIM_KEY:-}'
    volumes:
      - ./scripts/simulate-alerts.mjs:/demo/simulate-alerts.mjs:ro
    depends_on:
      app:
        condition: service_healthy
  smoke:
    profiles: ["test"]
    image: node:24-bookworm-slim
    working_dir: /tests
    command: ["node", "smoke.mjs"]
    environment:
      SOC_URL: http://app:8080
    volumes:
      - ./tests/smoke.mjs:/tests/smoke.mjs:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  socsql:
  sockeys:
