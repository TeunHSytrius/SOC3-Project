services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: '${SOC_SQL_PASSWORD:-SocDemo!2026Local}'
    volumes:
      - socsql:/var/opt/mssql
  app:
    build: .
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ConnectionStrings__Soc: 'Server=sqlserver,1433;Database=Soc3Demo;User Id=sa;Password=${SOC_SQL_PASSWORD:-SocDemo!2026Local};Encrypt=True;TrustServerCertificate=True;Connect Timeout=5'
      Demo__Enabled: 'true'
      ASPNETCORE_ENVIRONMENT: Development
      DataProtection__KeyPath: /app/keys
    volumes:
      - sockeys:/app/keys
    depends_on:
      - sqlserver
volumes:
  socsql:
  sockeys:
