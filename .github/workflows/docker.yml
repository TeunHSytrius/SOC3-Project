name: Docker build and smoke test
on:
  push:
    branches: [main, refactor/readable-code, refactor/app-structure]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run backend unit and database model tests
        run: dotnet test backend/Soc.Tests/Soc.Tests.csproj --configuration Release
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start fresh demo
        run: docker compose up --build --wait --wait-timeout 360
      - name: Verify HTTP readiness
        run: curl -fsS http://127.0.0.1:8081/api/v1/health
      - name: Verify restored tables in the same SQL database
        run: |
          docker compose exec -T sqlserver sh -c 'exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d Soc3Demo -Q "$1"' sh "IF OBJECT_ID(N'domain.Alerts', N'U') IS NULL OR OBJECT_ID(N'domain.Tickets', N'U') IS NULL OR OBJECT_ID(N'domain.Researches', N'U') IS NULL OR OBJECT_ID(N'platform.AspNetUsers', N'U') IS NULL THROW 50000, 'Combined database tables missing', 1;"
      - name: Run API smoke test
        run: docker compose --profile test run --rm smoke
      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app sqlserver
      - name: Stop containers
        if: always()
        run: docker compose down
