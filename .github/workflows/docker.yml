name: Docker build and smoke test
on:
  push:
    branches: [main, refactor/readable-code]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start fresh demo
        run: docker compose up --build --wait --wait-timeout 360
      - name: Verify HTTP readiness
        run: curl -fsS http://127.0.0.1:8081/api/v1/health
      - name: Run API smoke test
        run: docker compose --profile test run --rm smoke
      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app sqlserver
      - name: Stop containers
        if: always()
        run: docker compose down
