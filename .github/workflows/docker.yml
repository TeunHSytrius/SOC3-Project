name: Docker build and smoke test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run backend unit and database model tests
        run: dotnet test backend/Soc.Tests/Soc.Tests.csproj --configuration Release
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start fresh demo
        run: docker compose up --build --wait --wait-timeout 360
      - name: Verify HTTP readiness
        run: curl -fsS http://127.0.0.1:8081/api/v1/health
      - name: Verify restored tables in the same SQL database
        run: |
          docker compose exec -T sqlserver sh -c 'exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -b -d Soc3Demo -Q "$1"' sh "IF OBJECT_ID(N'domain.Alerts', N'U') IS NULL OR OBJECT_ID(N'domain.Tickets', N'U') IS NULL OR OBJECT_ID(N'domain.Researches', N'U') IS NULL OR OBJECT_ID(N'platform.AspNetUsers', N'U') IS NULL THROW 50000, 'Combined database tables missing', 1;"
      - name: Run API smoke test
        run: docker compose --profile test run --rm smoke
      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200 app sqlserver
      - name: Stop containers
        if: always()
        run: docker compose down

  native:
    name: Native application startup and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start SQL Server only
        run: docker compose up -d --wait --wait-timeout 360 sqlserver
      - name: Configure local development database
        run: |
          dotnet user-secrets set "ConnectionStrings:Soc" 'Server=127.0.0.1,14333;Database=Soc3NativeCi;User Id=sa;Password=SocDemo!2026Local;Encrypt=True;TrustServerCertificate=True' --project backend/Soc.Api/Soc.Api.csproj
          dotnet restore SOC3.slnx
          dotnet build SOC3.slnx --no-restore
      - name: Install and build native frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Start native backend and frontend and verify integration
        shell: bash
        run: |
          set -euo pipefail

          api_log="$RUNNER_TEMP/soc-native-api.log"
          frontend_log="$RUNNER_TEMP/soc-native-frontend.log"

          dotnet run --project backend/Soc.Api/Soc.Api.csproj --launch-profile "Local Development" --no-build > "$api_log" 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev > "$frontend_log" 2>&1 &
          frontend_pid=$!

          cleanup() {
            kill "$frontend_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_http() {
            local url="$1"
            local attempt
            for attempt in $(seq 1 90); do
              if curl --fail --silent --max-time 5 "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Service not ready: $url" >&2
            return 1
          }

          wait_for_http http://localhost:8081/api/v1/health
          wait_for_http http://localhost:5173/
          wait_for_http http://localhost:5173/api/v1/health

          curl --fail --silent http://localhost:5173/ | grep -q '<div id="root"'
          SOC_URL=http://localhost:5173 node tests/smoke.mjs
      - name: Print native diagnostics on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/soc-native-api.log" "$RUNNER_TEMP/soc-native-frontend.log"; do
            if [ -f "$log" ]; then
              echo "=== $log ==="
              tail -n 150 "$log"
            fi
          done
          docker compose ps -a
          docker compose logs --no-color --tail=100 sqlserver
      - name: Stop SQL Server
        if: always()
        run: docker compose down
