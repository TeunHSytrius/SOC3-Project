name: Format and verify readable-code branch
on:
  push:
    branches: [refactor/readable-code]
permissions:
  contents: write
jobs:
  format-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format C sharp
        run: |
          dotnet restore SOC3.slnx
          dotnet format whitespace SOC3.slnx --no-restore
      - name: Format frontend and scripts
        run: npx --yes prettier@3.6.2 --write "frontend/src/**/*.{ts,tsx,css}" "scripts/*.mjs" "tests/*.mjs"
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start fresh demo
        run: docker compose up --build --wait --wait-timeout 360
      - name: Verify readiness
        run: curl -fsS http://127.0.0.1:8081/api/v1/health
      - name: Run API smoke tests
        run: docker compose --profile test run --rm smoke
      - name: Publish verified formatting to refactor branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend frontend/src scripts tests
          git rm .github/workflows/refactor-format.yml
          git commit -m "style: apply standard C sharp and TypeScript formatting"
          git push origin HEAD:refactor/readable-code
      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100 app sqlserver
      - name: Stop containers
        if: always()
        run: docker compose down
